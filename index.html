function useLS(key, init) {
  const [val, setVal] = useState(() => {
    try { return JSON.parse(localStorage.getItem("wts_" + key)) ?? init; } catch { return init; }
  });
  const save = useCallback((v) => {
    setVal(prev => {
      const next = typeof v === "function" ? v(prev) : v;
      try { localStorage.setItem("wts_" + key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [val, save];
}

function LoadingScreen({ section, animIdx, duration=700 }) {
  const msgs = LOAD_MSGS[section] || ["Chargement…"];
  const [mi, setMi] = useState(0);
  useEffect(()=>{
    const step = Math.max(300, Math.floor(duration/msgs.length));
    const t=setInterval(()=>setMi(i=>(i+1)%msgs.length), step);
    return()=>clearInterval(t);
  },[duration, msgs.length]);

  const keyframes = `
    @keyframes rp1{0%,100%{transform:scale(.6);opacity:.9}50%{transform:scale(1.3);opacity:.1}}
    @keyframes db1{from{transform:translateY(0)}to{transform:translateY(-12px)}}
    @keyframes bar1{from{width:10%}to{width:100%}}
    @keyframes ldg{from{width:40px}to{width:120px}}
    @keyframes orb1{to{transform:rotate(360deg)}}
    @keyframes cs1{from{height:8px}to{height:36px}}
    @keyframes ck1{to{opacity:.3}}
    @keyframes wts-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
    @keyframes bin-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
    @keyframes fact-slide{0%{transform:translateX(-20px);opacity:0}100%{transform:translateX(0);opacity:1}}
  `;

  // Special loading screens
  const isCorbeille = section === "corbeille";
  const isFact = section === "newFacture";

  let icon;
  if (isCorbeille) {
    icon = `<svg width="72" height="72" viewBox="0 0 72 72" style="animation:bin-shake 0.6s ease-in-out infinite"><rect x="14" y="24" width="44" height="38" rx="4" fill="#A2177F"/><rect x="10" y="18" width="52" height="8" rx="2" fill="#7B1160"/><rect x="28" y="12" width="16" height="6" rx="2" fill="#A2177F"/><line x1="24" y1="32" x2="24" y2="54" stroke="#F8EA11" stroke-width="2" stroke-linecap="round"/><line x1="36" y1="32" x2="36" y2="54" stroke="#F8EA11" stroke-width="2" stroke-linecap="round"/><line x1="48" y1="32" x2="48" y2="54" stroke="#F8EA11" stroke-width="2" stroke-linecap="round"/></svg>`;
  } else if (isFact) {
    icon = `<svg width="72" height="90" viewBox="0 0 72 90" style="animation:fact-slide .5s ease"><rect x="8" y="6" width="56" height="78" rx="4" fill="#fff" stroke="#A2177F" stroke-width="2"/><rect x="8" y="6" width="56" height="14" rx="4" fill="#A2177F"/><text x="36" y="17" text-anchor="middle" font-size="8" fill="#F8EA11" font-weight="700" font-family="Arial">FACTURE</text><rect x="14" y="26" width="44" height="2" rx="1" fill="#e8e0ea"/><rect x="14" y="32" width="30" height="2" rx="1" fill="#e8e0ea"/><rect x="14" y="42" width="44" height="1" rx="0.5" fill="#f3e5f5"/><rect x="14" y="48" width="44" height="1" rx="0.5" fill="#f3e5f5"/><rect x="14" y="54" width="44" height="1" rx="0.5" fill="#f3e5f5"/><rect x="14" y="60" width="44" height="1" rx="0.5" fill="#f3e5f5"/><rect x="14" y="70" width="30" height="3" rx="1" fill="#A2177F"/><rect x="48" y="70" width="10" height="3" rx="1" fill="#F8EA11"/></svg>`;
  } else {
    icon = ANIMS[animIdx % ANIMS.length];
  }

  return (
    <div style={{position:"fixed",inset:0,background:"#faf5fb",zIndex:9999,display:"flex",
      flexDirection:"column",alignItems:"center",justifyContent:"center",gap:28}}>
      <style>{keyframes}</style>

      <p style={{fontSize:13,color:VIO2,fontWeight:500,letterSpacing:"0.3px"}}>{msgs[mi]}</p>
    </div>
  );
}

// RECEIPT EDITOR
// ═══════════════════════════════════════════════════════
function ReceiptEditor({ receipts, setReceipts, journal, setJournal, debcred, setDebCred, stock, setStock, onNpRequired, sendToTrash }) {
  const nextNum = receipts.length>0 ? Math.max(...receipts.map(r=>r.number))+1 : 1;
  const [form, setForm] = useState({
    number:nextNum, date:TODAY(), client:"", obs:"",
    items:WEIGHTS.map(w=>({...w,qty:"",effectivePrice:w.price,adjusted:false})),
    statut:"non-paye"
  });
  const [saved,setSaved]=useState(false);
  const [warn,setWarn]=useState([]);

  const total = form.items.reduce((s,i)=>s+(Number(i.qty)||0)*(i.effectivePrice||0),0);
  const totalQte = form.items.reduce((s,i)=>s+(Number(i.qty)||0),0);

  const updateItem=(idx,field,val)=>{
    const items=[...form.items]; items[idx]={...items[idx],[field]:val};
    if(field==="effectivePrice") items[idx].adjusted=(Number(val)!==items[idx].price);
    if(field==="qty"){
      const w=items[idx]; const stk=stock[w.col]||0;
      if(Number(val)>stk&&stk>0) setWarn([`⚠️ ${w.label} : stock=${stk}, vente=${val}`]);
      else setWarn([]);
    }
    setForm(f=>({...f,items}));
  };

  const handleSave=()=>{
    if(!form.client){alert("Sélectionnez un client.");return;}
    if(totalQte===0){alert("Ajoutez au moins un article.");return;}
    const rec={...form,id:Date.now(),savedAt:new Date().toISOString()};
    setReceipts(p=>[rec,...p]);
    const entries=form.items.filter(i=>Number(i.qty)>0).map(i=>({
      id:Date.now()+Math.random(),date:form.date,client:form.client,categorie:i.label,code:i.code,
      qty:Number(i.qty),prix:i.effectivePrice,montant:Number(i.qty)*(i.effectivePrice||0),
      receiptId:rec.id
    }));
    setJournal(p=>[...entries,...p]);
    const lastSolde=debcred.length>0?debcred[0].solde:0;
    setDebCred(p=>[{id:Date.now()+Math.random(),date:form.date,op:form.client,credit:total,debit:0,
      solde:lastSolde+total,receiptId:rec.id,type:"vente",cpt:"701/57"},...p]);
    const ns={...stock};
    form.items.filter(i=>Number(i.qty)>0).forEach(i=>{ ns[i.col]=Math.max(0,(ns[i.col]||0)-Number(i.qty)); });
    setStock(ns);
    setSaved(true); setTimeout(()=>setSaved(false),2500);
    onNpRequired(rec);
  };

  return (
    <div>
      <SectionHeader icon="🧾" title="Saisie de Reçu" sub="Journal, caisse et stock mis à jour automatiquement."/>
      {warn.length>0&&<div style={{background:"#fff8e1",border:"1px solid #ffc107",borderLeft:"4px solid #f57c00",borderRadius:8,padding:"10px 14px",marginBottom:14}}>{warn.map((w,i)=><p key={i} style={{fontSize:12,color:"#e65100",margin:0,fontWeight:500}}>{w}</p>)}</div>}
      <div style={{display:"grid",gridTemplateColumns:"280px 1fr",gap:20}}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Card>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"#faf0f8",border:"1px solid rgba(162,23,127,.15)",borderRadius:8,marginBottom:14}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:YEL,border:`2px solid ${VIO}`}}/>
              <span style={{fontSize:12,color:VIO2,fontWeight:500}}>Reçu N°{PAD(form.number)}</span>
            </div>
            <Field label="Date" style={{marginBottom:12}}>
              <input style={S.inp} type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
            </Field>
            <Field label="Client" style={{marginBottom:12}}>
              <select style={S.inp} value={form.client} onChange={e=>setForm({...form,client:e.target.value})}>
                <option value="">— Sélectionner —</option>
                {CLIENTS.map(c=><option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Statut">
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {[["paye","✓ Payé comptant"],["non-paye","✗ Non payé"],["partiel","⟳ Paiement partiel"]].map(([v,l])=>(
                  <label key={v} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"#1a1a2e",
                    padding:"7px 10px",borderRadius:8,background:form.statut===v?"#f3e5f5":"transparent",
                    border:`1px solid ${form.statut===v?VIO:"transparent"}`,transition:"all .15s"}}>
                    <input type="radio" name="st" value={v} checked={form.statut===v} onChange={()=>setForm({...form,statut:v})} style={{accentColor:VIO}}/>{l}
                  </label>
                ))}
              </div>
            </Field>
          </Card>
          <div style={{background:VIO,borderRadius:12,padding:18,color:"#fff"}}>
            <p style={{fontSize:12,opacity:.75,margin:"0 0 4px"}}>Total commande</p>
            <div style={{fontSize:24,fontWeight:800,color:YEL,letterSpacing:-1,margin:"0 0 10px"}}>{FMT(total)}</div>
            <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:"1px solid rgba(255,255,255,.15)"}}>
              <span style={{fontSize:12,opacity:.75}}>{totalQte} poulets</span>
              <span style={{background:YEL,color:VIO2,fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                {form.statut==="paye"?"Payé":"En attente"}
              </span>
            </div>
          </div>
          <Card style={{background:"#faf5fb",padding:"14px 16px"}}>
            <p style={{fontSize:11,fontWeight:700,color:VIO,margin:"0 0 8px",textTransform:"uppercase",letterSpacing:"0.5px"}}>Prix catalogue</p>
            {WEIGHTS.filter(w=>w.price).map(w=>(
              <div key={w.code} style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                <span style={{color:"#555"}}>{w.label}</span>
                <span style={{fontWeight:600,color:VIO}}>{w.price?.toLocaleString("fr-FR")} F</span>
              </div>
            ))}
          </Card>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
            <UBtn onClick={()=>setForm({number:Math.max(...receipts.map(r=>r.number),0)+2,date:TODAY(),client:"",obs:"",items:WEIGHTS.map(w=>({...w,qty:"",effectivePrice:w.price,adjusted:false})),statut:"non-paye"})}>🔄 Nouveau</UBtn>
            <UBtn primary onClick={handleSave} style={{background:saved?"#2e7d32":VIO}}>
              {saved?"✓ Enregistré !":"💾 Enregistrer"}
            </UBtn>
          </div>
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"12px 18px",borderBottom:"1px solid #ece6f0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:14,fontWeight:600,color:"#1a1a2e"}}>Détails des Produits</span>
              <span style={{fontSize:11,color:"#9e9e9e"}}>Modifier le prix = réduction automatique</span>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr>
                    {["Catégorie","Prix Normal","Qté","Prix Effectif","Total"].map((h,i)=>(
                      <th key={i} style={{...S.th,textAlign:i>1?"center":"left"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {form.items.map((item,i)=>{
                    const hasQty=Number(item.qty)>0;
                    const isAdj=item.adjusted&&item.effectivePrice!==item.price;
                    const lineTotal=(Number(item.qty)||0)*(item.effectivePrice||0);
                    return (
                      <tr key={i} style={{background:hasQty?"#f9f5fb":(i%2===0?"#fff":"#fafafa"),borderBottom:"1px solid #ece6f0"}}>
                        <td style={S.td}>
                          <div style={{fontWeight:600,fontSize:13}}>{item.label}</div>
                          <div style={{fontSize:11,color:"#9e9e9e"}}>{item.code}</div>
                        </td>
                        <td style={{...S.td,textAlign:"center"}}>
                          {item.price?<span style={{fontSize:12,color:"#9e9e9e"}}>{item.price.toLocaleString("fr-FR")} F</span>:<span style={{fontSize:11,color:"#bbb",fontStyle:"italic"}}>Variable</span>}
                        </td>
                        <td style={{...S.td,textAlign:"center"}}>
                          <input type="number" min="0" style={{width:56,textAlign:"center",background:"#f3e5f5",border:"1px solid #e0d0e8",borderRadius:6,padding:5,fontSize:13,outline:"none",fontFamily:"inherit"}}
                            value={item.qty} onChange={e=>updateItem(i,"qty",e.target.value)} placeholder="0"/>
                        </td>
                        <td style={{...S.td,textAlign:"center"}}>
                          {isAdj&&<span style={{fontSize:10,textDecoration:"line-through",color:"#bbb",display:"block"}}>{item.price?.toLocaleString("fr-FR")} F</span>}
                          <input type="number" min="0" style={{width:80,textAlign:"right",background:isAdj?"#e8f5e9":"#f5f0f7",border:`1px solid ${isAdj?"#2e7d32":"#e0d0e8"}`,borderRadius:6,padding:"5px 7px",fontSize:13,color:isAdj?"#2e7d32":VIO,fontWeight:600,outline:"none",fontFamily:"inherit"}}
                            value={item.effectivePrice||""} onChange={e=>updateItem(i,"effectivePrice",Number(e.target.value))}/>
                        </td>
                        <td style={{...S.td,textAlign:"right",fontWeight:700}}>
                          {hasQty?FMT(lineTotal):<span style={{color:"#ccc"}}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <Card>
              <Field label="Observations">
                <textarea style={{...S.inp,resize:"none",height:80}} rows={3}
                  placeholder="Notes..." value={form.obs}
                  onChange={e=>setForm({...form,obs:e.target.value})}/>
              </Field>
            </Card>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:8}}>
                <span style={{color:"#9e9e9e"}}>Sous-total</span>
                <span style={{fontWeight:600}}>{FMT(total)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:8}}>
                <span style={{color:"#9e9e9e"}}>Quantité</span>
                <span style={{fontWeight:600,color:VIO}}>{totalQte} pcs</span>
              </div>
              <hr style={{border:"none",borderTop:"1px solid #ece6f0",margin:"8px 0"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
                <span style={{fontSize:11,fontWeight:600,textTransform:"uppercase",color:"#9e9e9e",letterSpacing:"0.6px"}}>Net à payer</span>
                <span style={{fontSize:20,fontWeight:800,color:VIO,letterSpacing:-0.5}}>{FMT(total)}</span>
              </div>
            </Card>
          </div>
        </div>
      </div>
    </div>
  );
}

// JOURNAL (3 sections)
// ═══════════════════════════════════════════════════════
function JournalView({ journal, setJournal, sendToTrash }) {
  const [tab,setTab]=useState("global");
  const [expReceipt,setExpReceipt]=useState(null);
  const [expClient,setExpClient]=useState(null);
  const [fd,setFd]=useState("");
  const filtered=fd?journal.filter(e=>e.date===fd):journal;
  const total=filtered.reduce((s,e)=>s+e.montant,0);
  const totalQte=filtered.reduce((s,e)=>s+e.qty,0);

  const deleteEntry=(entry)=>{
    sendToTrash("journal", entry);
    setJournal(p=>p.filter(e=>e.id!==entry.id));
  };

  const byReceipt=useMemo(()=>{
    const g={};
    journal.forEach(e=>{
      const k=e.receiptId||e.date+"-"+e.client;
      if(!g[k]) g[k]={id:k,date:e.date,client:e.client,items:[],total:0,totalQte:0};
      g[k].items.push(e); g[k].total+=e.montant; g[k].totalQte+=e.qty;
    });
    return Object.values(g).sort((a,b)=>b.date.localeCompare(a.date));
  },[journal]);

  const byClient=useMemo(()=>{
    const g={};
    journal.forEach(e=>{
      if(!g[e.client]) g[e.client]={client:e.client,items:[],total:0,totalQte:0};
      g[e.client].items.push(e); g[e.client].total+=e.montant; g[e.client].totalQte+=e.qty;
    });
    return Object.values(g).sort((a,b)=>b.total-a.total);
  },[journal]);

  const byCat=useMemo(()=>{
    const g={};
    filtered.forEach(e=>{
      if(!g[e.code]) g[e.code]={code:e.code,label:e.categorie,qty:0,total:0};
      g[e.code].qty+=e.qty; g[e.code].total+=e.montant;
    });
    return Object.values(g).sort((a,b)=>b.total-a.total);
  },[filtered]);

  return (
    <div>
      <SectionHeader icon="📋" title="Journal des Ventes" sub="Compte 701 — Ventes de marchandises"/>
      <div style={{display:"flex",gap:8,marginBottom:20,borderBottom:"1px solid #ece6f0",paddingBottom:12}}>
        {[["global","① Journal Global"],["individuel","② Par Client"],["comptable","③ Écriture Comptable"]].map(([k,v])=>(
          <UBtn key={k} onClick={()=>setTab(k)} primary={tab===k}>{v}</UBtn>
        ))}
      </div>

      {tab==="global" && (
        <div>
          <div style={{display:"flex",gap:12,marginBottom:14,alignItems:"flex-end",flexWrap:"wrap"}}>
            <div style={{display:"flex",gap:10}}>
              <Stat label="Total FCFA" value={FMT(total)} color={VIO} bg="#f3e5f5" small/>
              <Stat label="Qté totale" value={totalQte} color="#2e7d32" bg="#e8f5e9" small/>
              <Stat label="Lignes" value={filtered.length} color="#1565c0" bg="#e3f2fd" small/>
            </div>
            <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center"}}>
              <input type="date" style={{...S.inp,width:170}} value={fd} onChange={e=>setFd(e.target.value)}/>
              {fd&&<UBtn small onClick={()=>setFd("")}>✕</UBtn>}
            </div>
          </div>
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{overflowX:"auto",maxHeight:520}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:750}}>
                <thead style={{position:"sticky",top:0,zIndex:1}}>
                  <tr style={{background:VIO}}>
                    <th style={{...S.th,background:VIO,color:YEL,textAlign:"center",borderBottom:"none"}}>DATE</th>
                    <th style={{...S.th,background:VIO,color:YEL,textAlign:"left",borderBottom:"none"}}>CLIENT</th>
                    {WEIGHTS.map(w=>(
                      <th key={w.code} style={{...S.th,background:VIO2,color:"#fff",textAlign:"center",borderBottom:"none",fontSize:10,padding:"9px 6px"}}>{w.label}</th>
                    ))}
                    <th style={{...S.th,background:VIO,color:YEL,textAlign:"center",borderBottom:"none"}}>QTÉ</th>
                    <th style={{...S.th,background:VIO,color:YEL,textAlign:"center",borderBottom:"none",width:32}}></th>
                  </tr>
                </thead>
                <tbody>
                  {byReceipt.filter(r=>!fd||r.date===fd).length===0 && (
                    <tr><td colSpan={WEIGHTS.length+4} style={{padding:32,textAlign:"center",color:"#bbb",fontStyle:"italic"}}>Aucune vente enregistrée.</td></tr>
                  )}
                  {byReceipt.filter(r=>!fd||r.date===fd).map((rec,ri)=>[
                    <tr key={rec.id} style={{background:ri%2===0?"#fff":"#faf5fb",cursor:"pointer",borderBottom:"1px solid #ece6f0"}}
                      onClick={()=>setExpReceipt(expReceipt===rec.id?null:rec.id)}>
                      <td style={{...S.td,textAlign:"center",fontSize:12,color:"#555"}}>{rec.date}</td>
                      <td style={{...S.td,fontWeight:600}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontSize:10,color:VIO,transition:"transform .2s",display:"inline-block",transform:expReceipt===rec.id?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                          {rec.client}
                        </div>
                      </td>
                      {WEIGHTS.map(w=>{
                        const match=rec.items.find(i=>i.code===w.code);
                        return <td key={w.code} style={{...S.td,textAlign:"center",fontWeight:match?.qty>0?700:400,color:match?.qty>0?VIO:"#ddd"}}>{match?.qty>0?match.qty:"—"}</td>;
                      })}
                      <td style={{...S.td,textAlign:"center",fontWeight:800,fontSize:14,color:VIO}}>{rec.totalQte}</td>
                      <td style={{...S.td,textAlign:"center"}}>
                        <div onClick={e=>e.stopPropagation()}>
                          <TrashIcon onClick={()=>rec.items.forEach(deleteEntry)} size={14}/>
                        </div>
                      </td>
                    </tr>,
                    expReceipt===rec.id && (
                      <tr key={rec.id+"-exp"} style={{background:"#faf0f8"}}>
                        <td colSpan={WEIGHTS.length+4} style={{padding:"12px 20px"}}>
                          <div style={{borderLeft:`3px solid ${VIO}`,paddingLeft:16}}>
                            {rec.items.map((item,j)=>(
                              <div key={j} style={{display:"flex",gap:20,fontSize:12,color:"#555",marginBottom:4,alignItems:"center"}}>
                                <span style={{fontWeight:600,color:VIO,width:100}}>{item.categorie}</span>
                                <span>Qté: <b>{item.qty}</b></span>
                                <span>Prix: <b>{(item.prix||0).toLocaleString("fr-FR")} F</b></span>
                                <span>Total: <b style={{color:VIO}}>{FMT(item.montant)}</b></span>
                                <TrashIcon onClick={()=>deleteEntry(item)} size={12}/>
                              </div>
                            ))}
                            <div style={{marginTop:8,fontWeight:700,color:VIO,fontSize:13}}>Total reçu : {FMT(rec.total)} — {rec.totalQte} poulets</div>
                          </div>
                        </td>
                      </tr>
                    )
                  ])}
                </tbody>
                {byReceipt.filter(r=>!fd||r.date===fd).length>0&&(
                  <tfoot>
                    <tr style={{background:VIO}}>
                      <td colSpan={2} style={{padding:"10px 14px",fontWeight:700,color:"#fff",fontSize:13}}>TOTAL</td>
                      {WEIGHTS.map(w=>{
                        const tot=filtered.filter(e=>e.code===w.code).reduce((s,e)=>s+e.qty,0);
                        return <td key={w.code} style={{padding:"10px 6px",textAlign:"center",fontWeight:800,color:tot>0?YEL:"rgba(255,255,255,.3)",fontSize:tot>0?13:12}}>{tot>0?tot:"—"}</td>;
                      })}
                      <td style={{padding:"10px 14px",textAlign:"center",fontWeight:800,color:YEL,fontSize:15}}>{totalQte}</td>
                      <td/>
                    </tr>
                  </tfoot>
                )}
              </table>
            </div>
          </Card>
        </div>
      )}

      {tab==="individuel" && (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {byClient.length===0&&<Card style={{textAlign:"center",color:"#bbb",padding:40,fontStyle:"italic"}}>Aucune vente.</Card>}
          {byClient.map((cl,i)=>(
            <Card key={i} style={{padding:0,overflow:"hidden",border:`1px solid ${expClient===cl.client?VIO:"#ece6f0"}`}}>
              <div style={{padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}
                onClick={()=>setExpClient(expClient===cl.client?null:cl.client)}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:VIO3,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:VIO,fontSize:14}}>{cl.client[0]}</div>
                  <div>
                    <p style={{fontWeight:700,fontSize:14,color:"#1a1a2e",margin:0}}>{cl.client}</p>
                    <p style={{fontSize:11,color:"#9e9e9e",margin:0}}>{cl.items.length} transaction(s)</p>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:16}}>
                  <div style={{textAlign:"right"}}>
                    <p style={{fontSize:16,fontWeight:800,color:VIO,margin:0}}>{FMT(cl.total)}</p>
                    <p style={{fontSize:11,color:"#9e9e9e",margin:0}}>{cl.totalQte} poulets</p>
                  </div>
                  <span style={{color:VIO,fontSize:14,transition:"transform .2s",display:"inline-block",transform:expClient===cl.client?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                </div>
              </div>
              {expClient===cl.client&&(
                <div style={{borderTop:"1px solid #ece6f0"}}>
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead>
                      <tr style={{background:"#faf5fb"}}>
                        {["Date","Catégorie","Qté","Prix","Montant",""].map((h,j)=>(
                          <th key={j} style={{...S.th,textAlign:j>1&&j<5?"center":"left",padding:"8px 14px"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {cl.items.map((item,j)=>(
                        <tr key={j} style={{background:j%2===0?"#fff":"#faf5fb",borderBottom:"1px solid #ece6f0"}}>
                          <td style={{...S.td,fontSize:12,color:"#555",padding:"9px 14px"}}>{item.date}</td>
                          <td style={{...S.td,fontWeight:500,padding:"9px 14px"}}>{item.categorie}</td>
                          <td style={{...S.td,textAlign:"center",fontWeight:700,color:VIO,padding:"9px 14px"}}>{item.qty}</td>
                          <td style={{...S.td,textAlign:"center",fontSize:12,color:"#9e9e9e",padding:"9px 14px"}}>{(item.prix||0).toLocaleString("fr-FR")} F</td>
                          <td style={{...S.td,textAlign:"center",fontWeight:700,padding:"9px 14px"}}>{FMT(item.montant)}</td>
                          <td style={{...S.td,padding:"9px 14px",textAlign:"right"}}>
                            <TrashIcon onClick={()=>deleteEntry(item)} size={13}/>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          ))}
        </div>
      )}

      {tab==="comptable" && (
        <div>
          <div style={{display:"flex",gap:12,marginBottom:14,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div style={{display:"flex",gap:10}}>
              <Stat label="Cpt 701" value={FMT(total)} color="#2e7d32" bg="#e8f5e9" small/>
              <Stat label="Cpt 57" value={FMT(total)} color={VIO} bg="#f3e5f5" small/>
            </div>
            <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center"}}>
              <input type="date" style={{...S.inp,width:170}} value={fd} onChange={e=>setFd(e.target.value)}/>
              {fd&&<UBtn small onClick={()=>setFd("")}>✕</UBtn>}
            </div>
          </div>
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"12px 18px",borderBottom:"1px solid #ece6f0",background:VIO}}>
              <span style={{fontSize:13,fontWeight:700,color:YEL}}>JOURNAL COMPTABLE — SYSCOHADA</span>
            </div>
            <div style={{overflowX:"auto",maxHeight:500}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:650}}>
                <thead>
                  <tr style={{background:"#faf5fb"}}>
                    {["Date","Libellé","N° Cpt","Intitulé","Débit","Crédit"].map((h,i)=>(
                      <th key={i} style={{...S.th,textAlign:i>2?"right":"left"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {byCat.map((cat,i)=>[

// DÉBIT / CRÉDIT
// ═══════════════════════════════════════════════════════
function DebCredView({ debcred, setDebCred, sendToTrash }) {
  const [addMode,setAddMode]=useState(false);
  const [nd,setNd]=useState({date:TODAY(),op:"",credit:0,debit:0});

  const totalCr=debcred.reduce((s,e)=>s+e.credit,0);
  const totalDb=debcred.reduce((s,e)=>s+e.debit,0);
  const solde=debcred.length>0?debcred[0].solde:0;

  const addEntry=()=>{
    if(!nd.op) return;
    const lastSolde=debcred.length>0?debcred[0].solde:0;
    const cr=Number(nd.credit)||0; const db=Number(nd.debit)||0;
    const cpt=cr>0?"701/57":"60/57";
    setDebCred(p=>[{...nd,id:Date.now(),credit:cr,debit:db,solde:lastSolde+cr-db,cpt},...p]);
    setNd({date:TODAY(),op:"",credit:0,debit:0}); setAddMode(false);
  };

  const deleteEntry=(entry)=>{
    sendToTrash("debcred", entry);
    setDebCred(p=>{
      const remaining = p.filter(e=>e.id!==entry.id);
      // Recalc soldes
      let run=0;
      return remaining.reverse().map(e=>{ run = run + (e.credit||0) - (e.debit||0); return {...e, solde:run}; }).reverse();
    });
  };

  return (
    <div>
      <SectionHeader icon="💰" title="Fiche Débit / Crédit" sub="Compte 57 — Caisse · Solde actualisé en temps réel"/>
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <Stat label="Cpt 57 — Caisse" value={FMT(solde)} color={VIO} bg="#f3e5f5"/>
        <Stat label="Total crédits" value={FMT(totalCr)} color="#2e7d32" bg="#e8f5e9"/>
        <Stat label="Total débits" value={FMT(totalDb)} color="#B71C1C" bg="#ffebee"/>
        <div style={{marginLeft:"auto"}}>
          <UBtn primary onClick={()=>setAddMode(m=>!m)}>{addMode?"✕ Annuler":"+ Ajouter sortie"}</UBtn>
        </div>
      </div>
      {addMode&&(
        <Card style={{marginBottom:14,border:`2px solid ${VIO}`}}>
          <p style={{fontSize:13,fontWeight:700,color:VIO,margin:"0 0 12px"}}>Nouvelle opération manuelle</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12}}>
            <Field label="Date"><input style={S.inp} type="date" value={nd.date} onChange={e=>setNd({...nd,date:e.target.value})}/></Field>
            <Field label="Libellé"><input style={S.inp} placeholder="Opération..." value={nd.op} onChange={e=>setNd({...nd,op:e.target.value})}/></Field>
            <Field label="Crédit (FCFA)"><input style={S.inp} type="number" placeholder="0" value={nd.credit||""} onChange={e=>setNd({...nd,credit:Number(e.target.value)})}/></Field>
            <Field label="Débit (FCFA)"><input style={S.inp} type="number" placeholder="0" value={nd.debit||""} onChange={e=>setNd({...nd,debit:Number(e.target.value)})}/></Field>
          </div>
          <div style={{marginTop:12,display:"flex",justifyContent:"flex-end"}}>
            <UBtn primary onClick={addEntry}>✓ Ajouter</UBtn>
          </div>
        </Card>
      )}
      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto",maxHeight:520}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead style={{position:"sticky",top:0,zIndex:1}}>
              <tr style={{background:"#faf5fb"}}>
                {["Date","N° Cpt","Opération","Crédit","Débit","Solde",""].map((h,i)=>(
                  <th key={i} style={{...S.th,textAlign:i>2&&i<6?"right":"left"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {debcred.length===0&&<tr><td colSpan={7} style={{padding:32,textAlign:"center",color:"#bbb",fontStyle:"italic"}}>Aucun mouvement.</td></tr>}
              {debcred.map((e,i)=>(
                <tr key={e.id||i} style={{background:e.credit>0?"#f0faf4":e.debit>0?"#fff5f5":(i%2===0?"#fff":"#faf5fb"),borderBottom:"1px solid #ece6f0"}}>
                  <td style={{...S.td,fontSize:12,color:"#555"}}>{e.date}</td>
                  <td style={{...S.td,fontFamily:"monospace",fontWeight:700,fontSize:12,color:"#1565c0"}}>{e.cpt||"57"}</td>
                  <td style={{...S.td,fontWeight:500}}>{e.op}</td>
                  <td style={{...S.td,textAlign:"right",fontWeight:700,color:"#2e7d32"}}>{e.credit>0?FMT(e.credit):"—"}</td>
                  <td style={{...S.td,textAlign:"right",fontWeight:700,color:"#B71C1C"}}>{e.debit>0?`(${FMT(e.debit)})`:"—"}</td>
                  <td style={{...S.td,textAlign:"right",fontWeight:800,color:e.solde>=0?VIO:"#B71C1C",fontSize:14}}>{FMT(e.solde)}</td>
                  <td style={{...S.td,textAlign:"right",padding:"10px 14px"}}>
                    <TrashIcon onClick={()=>deleteEntry(e)} size={13}/>
                  </td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{background:VIO}}>
                <td colSpan={3} style={{padding:"10px 14px",color:"#fff",fontWeight:700}}>TOTAUX</td>
                <td style={{padding:"10px 14px",textAlign:"right",color:YEL,fontWeight:800}}>{FMT(totalCr)}</td>
                <td style={{padding:"10px 14px",textAlign:"right",color:"#ff8a80",fontWeight:800}}>({FMT(totalDb)})</td>
                <td style={{padding:"10px 14px",textAlign:"right",color:YEL,fontWeight:800}}>{FMT(solde)}</td>
                <td/>
              </tr>
            </tfoot>
          </table>
        </div>
      </Card>
    </div>
  );
}

// NON PAYEURS
// ═══════════════════════════════════════════════════════
function NonPayeursView({ nonPayeurs, setNonPayeurs, sendToTrash }) {
  const [exp,setExp]=useState(null);
  const total=nonPayeurs.reduce((s,r)=>s+r.montant,0);
  const grouped=useMemo(()=>{
    const g={};
    nonPayeurs.forEach(r=>{
      const k=r.client||r.op;
      if(!g[k]) g[k]={client:k,total:0,rows:[]};
      g[k].total+=r.montant; g[k].rows.push(r);
    });
    return Object.values(g).sort((a,b)=>b.total-a.total);
  },[nonPayeurs]);

  const deleteItem=(item)=>{
    sendToTrash("nonpayeurs", item);
    setNonPayeurs(p=>p.filter(r=>r.id!==item.id));
  };
  const deleteClient=(client)=>{
    const rows = nonPayeurs.filter(r=>(r.client||r.op)===client);
    rows.forEach(r=>sendToTrash("nonpayeurs",r));
    setNonPayeurs(p=>p.filter(r=>(r.client||r.op)!==client));
  };

  return (
    <div>
      <SectionHeader icon={<SectionIcon id="nonpayeurs" size={28}/>} title="Clients Non Payeurs" sub="Compte 411 — Clients débiteurs"/>
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <Stat label="Cpt 411" value={FMT(total)} color="#B71C1C" bg="#ffebee"/>
        <Stat label="Débiteurs" value={grouped.length} color="#e65100" bg="#fff3e0"/>
        <Stat label="Articles" value={nonPayeurs.length} color="#1565c0" bg="#e3f2fd"/>
      </div>
      {grouped.length===0&&<Card style={{textAlign:"center",padding:40}}><span style={{fontSize:32}}>✅</span><p style={{color:"#bbb",fontStyle:"italic",marginTop:10}}>Aucun impayé.</p></Card>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {grouped.map((g,gi)=>(
          <Card key={gi} style={{padding:0,overflow:"hidden",border:`1px solid ${exp===g.client?"#B71C1C":"#ece6f0"}`,transition:"border-color .2s"}}>
            <div style={{padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",background:exp===g.client?"#fff5f5":"#fff",transition:"background .15s"}}>
              <div onClick={()=>setExp(exp===g.client?null:g.client)} style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer",flex:1}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:"#ffebee",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:"#B71C1C",fontSize:15,flexShrink:0}}>
                  {g.client[0]?.toUpperCase()}
                </div>
                <div>
                  <p style={{fontWeight:700,fontSize:14,color:"#1a1a2e",margin:0}}>{g.client}</p>
                  <p style={{fontSize:11,color:"#9e9e9e",margin:0}}>{g.rows.length} article(s) — Cpt 411</p>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:16}}>
                <div style={{textAlign:"right"}}>
                  <p style={{fontSize:18,fontWeight:800,color:"#B71C1C",margin:0}}>{FMT(g.total)}</p>
                  <span style={{background:"#ffebee",color:"#B71C1C",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>NON ENCAISSÉ</span>
                </div>
                <TrashIcon onClick={()=>deleteClient(g.client)} size={15} title="Supprimer client"/>
                <span onClick={()=>setExp(exp===g.client?null:g.client)} style={{color:"#B71C1C",fontSize:14,transition:"transform .2s",display:"inline-block",transform:exp===g.client?"rotate(90deg)":"rotate(0deg)",cursor:"pointer"}}>▶</span>
              </div>
            </div>
            {exp===g.client&&(
              <div style={{borderTop:"1px solid #ffcdd2"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead>
                    <tr style={{background:"#ffebee"}}>
                      {["Date","Opération","Qté","Prix","Montant","Statut",""].map((h,i)=>(
                        <th key={i} style={{...S.th,background:"#ffebee",color:"#B71C1C",textAlign:i>1&&i<6?"center":"left",padding:"8px 14px"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {g.rows.map((r,i)=>(
                      <tr key={r.id||i} style={{borderBottom:"1px solid #ffebee",background:i%2===0?"#fff":"#fff5f5"}}>
                        <td style={{...S.td,fontSize:12,color:"#555",padding:"9px 14px"}}>{r.date||"—"}</td>
                        <td style={{...S.td,fontWeight:500,padding:"9px 14px"}}>{r.op}</td>
                        <td style={{...S.td,textAlign:"center",padding:"9px 14px"}}>{r.qte}</td>
                        <td style={{...S.td,textAlign:"center",fontSize:12,color:"#9e9e9e",padding:"9px 14px"}}>{(r.pu||0).toLocaleString("fr-FR")} F</td>
                        <td style={{...S.td,textAlign:"center",fontWeight:700,color:"#B71C1C",padding:"9px 14px"}}>{FMT(r.montant)}</td>
                        <td style={{...S.td,textAlign:"center",padding:"9px 14px"}}>
                          <span style={{background:"#ffebee",color:"#B71C1C",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20}}>{r.statut}</span>
                        </td>
                        <td style={{...S.td,padding:"9px 14px",textAlign:"right"}}>
                          <TrashIcon onClick={()=>deleteItem(r)} size={12}/>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Card>
        ))}
      </div>
    </div>
  );
}

// STOCK

function StockView({ stock, setStock, arrivals, setArrivals, sendToTrash }) {
  const [unlocked,setUnlocked]=useState(false);
  const [pwd,setPwd]=useState(""); const [pwdErr,setPwdErr]=useState(false);
  const [addMode,setAddMode]=useState(false);
  const [arrival,setArrival]=useState({date:TODAY(),note:"",items:{}});
  const [notif,setNotif]=useState(null);

  const tryUnlock=()=>{ if(pwd===STOCK_PWD){setUnlocked(true);setPwdErr(false);}else{setPwdErr(true);setTimeout(()=>setPwdErr(false),2000);} };
  const totalStock=WEIGHTS.reduce((s,w)=>s+(stock[w.col]||0),0);
  const totalVal=WEIGHTS.reduce((s,w)=>s+(stock[w.col]||0)*(w.price||0),0);

  const saveArrival=()=>{
    const ns={...stock};
    WEIGHTS.forEach(w=>{ const q=Number(arrival.items[w.col])||0; if(q>0) ns[w.col]=(ns[w.col]||0)+q; });
    setStock(ns); setArrivals(p=>[{...arrival,id:Date.now()},...p]);
    setArrival({date:TODAY(),note:"",items:{}}); setAddMode(false);
    setNotif("✅ Arrivage enregistré !"); setTimeout(()=>setNotif(null),3000);
  };

  const deleteArrival=(ar)=>{
    sendToTrash("arrivals", ar);
    setArrivals(p=>p.filter(a=>a.id!==ar.id));
  };

  if(!unlocked) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:400,gap:20}}>
      <span style={{fontSize:48}}>🔒</span>
      <h3 style={{fontSize:20,fontWeight:700,color:"#1a1a2e",margin:0}}>Accès Sécurisé — Stock</h3>
      <Card style={{width:340,textAlign:"center"}}>
        <Field label="Mot de passe admin" style={{marginBottom:14}}>
          <input style={{...S.inp,textAlign:"center"}} type="password" placeholder="••••••••••" value={pwd}
            onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryUnlock()}/>
        </Field>
        {pwdErr&&<p style={{color:"#B71C1C",fontSize:12,margin:"0 0 10px",fontWeight:500}}>Mot de passe incorrect.</p>}
        <UBtn primary full onClick={tryUnlock}>🔓 Déverrouiller</UBtn>
      </Card>
    </div>
  );

  return (
    <div>
      {notif&&<div style={{position:"fixed",top:20,right:20,zIndex:500,background:"#1a1a2e",color:"#fff",padding:"12px 18px",borderRadius:10,fontWeight:600,fontSize:13,borderLeft:`4px solid ${YEL}`}}>{notif}</div>}
      <SectionHeader icon="📦" title="Gestion du Stock" sub="Suivi des arrivages — Alertes automatiques"/>
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <Stat label="Total stock" value={`${totalStock}`} color="#2e7d32" bg="#e8f5e9"/>
        <Stat label="Valeur estimée" value={FMT(totalVal)} color={VIO} bg="#f3e5f5"/>
        <Stat label="Arrivages" value={arrivals.length} color="#1565c0" bg="#e3f2fd"/>
        <div style={{marginLeft:"auto",display:"flex",gap:10}}>
          <UBtn small onClick={()=>setUnlocked(false)}>🔒</UBtn>
          <UBtn primary onClick={()=>setAddMode(m=>!m)}>{addMode?"✕ Annuler":"+ Arrivage"}</UBtn>
        </div>
      </div>
      {addMode&&(
        <Card style={{marginBottom:16,border:`2px solid ${VIO}`}}>
          <p style={{fontSize:14,fontWeight:700,color:VIO,margin:"0 0 14px"}}>📥 Enregistrer un arrivage</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <Field label="Date"><input style={S.inp} type="date" value={arrival.date} onChange={e=>setArrival({...arrival,date:e.target.value})}/></Field>
            <Field label="Note"><input style={S.inp} placeholder="Ex: Abattage lot #12..." value={arrival.note} onChange={e=>setArrival({...arrival,note:e.target.value})}/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
            {WEIGHTS.map(w=>(
              <Field key={w.col} label={w.label}>
                <input style={{...S.inp,textAlign:"center"}} type="number" min="0" placeholder="0"
                  value={arrival.items[w.col]||""}
                  onChange={e=>setArrival(a=>({...a,items:{...a.items,[w.col]:e.target.value}}))}/>
              </Field>
            ))}
          </div>
          <div style={{marginTop:14,display:"flex",justifyContent:"flex-end"}}>
            <UBtn primary onClick={saveArrival}>✓ Enregistrer</UBtn>
          </div>
        </Card>
      )}
      <Card style={{padding:0,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"12px 18px",borderBottom:"1px solid #ece6f0",fontWeight:600,fontSize:14,color:"#1a1a2e",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>Niveaux de Stock</span>
          <span style={{fontSize:12,color:"#9e9e9e"}}>{new Date().toLocaleString("fr-FR")}</span>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:"#faf5fb"}}>
              {["Catégorie","Prix","En Stock","Valeur","Statut","Tendance"].map((h,i)=>(
                <th key={i} style={{...S.th,textAlign:i>1?"center":"left"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {WEIGHTS.map((w,i)=>{
              const qty=stock[w.col]||0;
              const val=qty*(w.price||0);
              const st=qty===0?"Rupture":qty<5?"Critique":qty<20?"Faible":"Disponible";
              const sc=qty===0?"#B71C1C":qty<5?"#e65100":qty<20?"#f57c00":"#2e7d32";
              const sb=qty===0?"#ffebee":qty<5?"#fff3e0":qty<20?"#fff8e1":"#e8f5e9";
              return (
                <tr key={i} style={{background:i%2===0?"#fff":"#faf5fb",borderBottom:"1px solid #ece6f0"}}>
                  <td style={{...S.td,fontWeight:600}}>{w.label}</td>
                  <td style={{...S.td,textAlign:"center",fontSize:12,color:"#9e9e9e"}}>{w.price?`${w.price.toLocaleString("fr-FR")} F`:"Variable"}</td>
                  <td style={{...S.td,textAlign:"center"}}>
                    <span style={{fontSize:20,fontWeight:800,color:qty>0?VIO:"#B71C1C"}}>{qty}</span>
                  </td>
                  <td style={{...S.td,textAlign:"center",fontWeight:600}}>{w.price?FMT(val):"—"}</td>
                  <td style={{...S.td,textAlign:"center"}}>
                    <span style={{background:sb,color:sc,fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:20}}>{st}</span>
                  </td>
                  <td style={{...S.td,textAlign:"center"}}>
                    {qty===0?<span style={{color:"#B71C1C",fontSize:16}}>↓</span>:qty<5?<span style={{color:"#e65100",fontSize:16}}>↓</span>:<span style={{color:"#2e7d32",fontSize:16}}>→</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr style={{background:VIO}}>
              <td colSpan={2} style={{padding:"10px 14px",fontWeight:700,color:"#fff"}}>TOTAUX</td>
              <td style={{padding:"10px 14px",textAlign:"center",fontWeight:800,color:YEL,fontSize:16}}>{totalStock}</td>
              <td style={{padding:"10px 14px",textAlign:"center",fontWeight:800,color:YEL}}>{FMT(totalVal)}</td>
              <td colSpan={2}/>
            </tr>
          </tfoot>
        </table>
      </Card>
      {arrivals.length>0 && (
        <Card style={{padding:0,overflow:"hidden"}}>
          <div style={{padding:"12px 18px",borderBottom:"1px solid #ece6f0",fontWeight:600,fontSize:14,color:"#1a1a2e"}}>
            Historique des Arrivages
          </div>
          <div style={{maxHeight:300,overflowY:"auto"}}>
            {arrivals.map((a,i)=>(
              <div key={a.id||i} style={{padding:"12px 18px",borderBottom:"1px solid #ece6f0",background:i%2===0?"#fff":"#faf5fb",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <span style={{fontSize:13,fontWeight:600,color:"#1a1a2e"}}>{a.date}</span>
                  {a.note && <span style={{fontSize:12,color:"#9e9e9e",marginLeft:12}}>{a.note}</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {WEIGHTS.filter(w=>(a.items[w.col]||0)>0).map(w=>(
                      <span key={w.col} style={{background:"#f3e5f5",color:VIO,fontSize:11,fontWeight:600,padding:"2px 8px",borderRadius:20}}>
                        {w.label}: +{a.items[w.col]}
                      </span>
                    ))}
                  </div>
                  <TrashIcon onClick={()=>deleteArrival(a)} size={14}/>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

function genFactureNum(type, existing) {
  const prefix = type === "vente" ? "FAC" : "BL";
  const year = YEAR();
  const nums = existing
    .filter(f => f.type === type && f.number?.startsWith(prefix))
    .map(f => {
      const m = f.number.match(/(\d+)$/);
      return m ? parseInt(m[1]) : 0;
    });
  const next = nums.length > 0 ? Math.max(...nums) + 1 : (type === "vente" ? 334 : 2);
  return `${prefix}-${year}-${PAD(next, 4)}`;
}

// Editable field component — shows lock icon if locked
function EField({ value, onChange, locked, placeholder, style = {}, multiline = false, small = false }) {
  const baseStyle = {
    background: locked ? "#f5f0f7" : "#fffbe6",
    border: locked ? "1px solid transparent" : "1px dashed #F8EA11",
    borderRadius: 4,
    padding: small ? "2px 6px" : "4px 8px",
    fontSize: small ? 11 : 13,
    color: "#1a1a2e",
    outline: "none",
    fontFamily: "inherit",
    width: "100%",
    cursor: locked ? "not-allowed" : "text",
    ...style,
  };
  if (locked) {
    return (
      <span style={{ display: "inline-flex", alignItems: "center", gap: 4, ...baseStyle, background: "transparent", border: "none", padding: 0 }}>
        <span>{value}</span>
        <span style={{ fontSize: 9, color: "#bbb", marginLeft: 4 }} title="Champ verrouillé">🔒</span>
      </span>
    );
  }
  if (multiline) {
    return <textarea style={{ ...baseStyle, resize: "none", minHeight: 36 }} value={value || ""} placeholder={placeholder} onChange={e => onChange(e.target.value)} />;
  }
  return <input style={baseStyle} value={value || ""} placeholder={placeholder} onChange={e => onChange(e.target.value)} />;
}

// Render a complete facture document (editable, print-friendly)
function FactureDoc({ facture, onChange, readonly = false }) {

  const updateItem = (idx, field, val) => {
    const items = [...facture.items];
    items[idx] = { ...items[idx], [field]: val };
    if (field === "qty" || field === "pu") {
      items[idx].total = (Number(items[idx].qty) || 0) * (Number(items[idx].pu) || 0);
    }
    onChange({ ...facture, items });
  };

  const addItem = () => {
    const newId = Math.max(0, ...facture.items.map(i => i.id || 0)) + 1;
    onChange({ ...facture, items: [...facture.items, { id: newId, desc: "", qty: 1, poids: "", pu: 0, total: 0 }] });
  };

  const removeItem = (idx) => {
    onChange({ ...facture, items: facture.items.filter((_, i) => i !== idx) });

function FactureView({ factures, setFactures, sendToTrash, onNewRequest }) {
  const [tab, setTab] = useState("vente");
  const [openId, setOpenId] = useState(null);
  const list = factures.filter(f => f.type === tab);
  const openFacture = list.find(f => f.id === openId);

  const updateFacture = (updated) => {
    setFactures(p => p.map(f => f.id === updated.id ? updated : f));
  };

  const deleteFacture = (fac) => {
    sendToTrash("facture", fac);
    setFactures(p => p.filter(f => f.id !== fac.id));
    if (openId === fac.id) setOpenId(null);
  };

  const printFacture = () => {
    window.print();
  };

  const downloadFacture = () => {
    if (!openFacture) return;
    const node = document.getElementById("facture-print");
    if (!node) return;
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${openFacture.number}</title>
<style>body{font-family:Arial,sans-serif;padding:20px;margin:0}
table{border-collapse:collapse}
img{max-width:100%}
input,textarea{border:none;background:transparent;font-family:inherit;font-size:inherit;color:inherit;padding:0}
input:focus,textarea:focus{outline:none}
</style></head><body>${node.outerHTML}</body></html>`;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${openFacture.number}.html`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <SectionHeader
        icon={<SectionIcon id="facture" size={28} />}
        title="Factures & Bons de Livraison"
        sub="Documents éditables — Format WTS infalsifiable"
        actions={
          <UBtn primary onClick={onNewRequest}>
            ✨ Nouvelle facture à imprimer
          </UBtn>
        }
      />

      {/* TABS */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20, borderBottom: "1px solid #ece6f0", paddingBottom: 12 }}>
        <UBtn primary={tab === "vente"} onClick={() => { setTab("vente"); setOpenId(null); }}>
          📄 Factures de Vente ({factures.filter(f => f.type === "vente").length})
        </UBtn>
        <UBtn primary={tab === "bdl"} onClick={() => { setTab("bdl"); setOpenId(null); }}>
          🚚 Bons de Livraison ({factures.filter(f => f.type === "bdl").length})
        </UBtn>
      </div>

      {/* OPEN DOC VIEW */}
      {openFacture ? (
        <div>
          <div style={{ display: "flex", gap: 10, marginBottom: 16, alignItems: "center", flexWrap: "wrap" }}>
            <UBtn onClick={() => setOpenId(null)}>← Retour à la liste</UBtn>
            <span style={{ fontSize: 13, color: "#9e9e9e", fontFamily: "monospace", fontWeight: 700 }}>{openFacture.number}</span>
            <div style={{ marginLeft: "auto", display: "flex", gap: 10 }}>
              <UBtn onClick={downloadFacture}>⬇ Télécharger</UBtn>
              <UBtn primary onClick={printFacture}>🖨 Imprimer</UBtn>
              <TrashIcon onClick={() => deleteFacture(openFacture)} size={16} />
            </div>
          </div>
          <FactureDoc facture={openFacture} onChange={updateFacture} />
        </div>
      ) : (
        <>
          {list.length === 0 && (
            <Card style={{ textAlign: "center", padding: 48 }}>
              <span style={{ fontSize: 42 }}>{tab === "vente" ? "📄" : "🚚"}</span>
              <p style={{ color: "#9e9e9e", margin: "12px 0 4px", fontWeight: 600 }}>
                Aucun {tab === "vente" ? "facture de vente" : "bon de livraison"}
              </p>
              <p style={{ fontSize: 12, color: "#bbb", margin: 0 }}>Cliquez sur "Nouvelle facture" pour créer un document.</p>
            </Card>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 14 }}>
            {list.map(fac => (
              <Card key={fac.id} style={{ padding: 0, overflow: "hidden", cursor: "pointer", transition: "all .2s" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = VIO; e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 8px 20px rgba(162,23,127,.12)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#ece6f0"; e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = ""; }}
                onClick={() => setOpenId(fac.id)}>
                <div style={{ background: VIO, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 11, fontWeight: 800, color: YEL, fontFamily: "monospace", letterSpacing: "0.3px" }}>{fac.number}</span>
                  <span style={{ fontSize: 9, color: "rgba(255,255,255,.7)", textTransform: "uppercase", letterSpacing: "0.6px" }}>
                    {fac.type === "vente" ? "FACTURE" : "BDL"}
                  </span>
                </div>
                <div style={{ padding: "14px 16px" }}>
                  <p style={{ fontSize: 14, fontWeight: 700, color: "#1a1a2e", margin: "0 0 4px" }}>{fac.client?.name || "—"}</p>
                  <p style={{ fontSize: 11, color: "#9e9e9e", margin: "0 0 10px" }}>

                    <p style={{ fontSize: 16, fontWeight: 800, color: VIO, margin: 0 }}>
                      {FMT(fac.items.reduce((s, i) => s + (Number(i.total) || 0), 0))}
                    </p>
                  )}

                </div>
                <div style={{ padding: "8px 14px", borderTop: "1px solid #ece6f0", display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fafafa" }}>
                  <span style={{ fontSize: 10, color: VIO, fontWeight: 600 }}>Cliquer pour éditer →</span>

                  </div>
                </div>
              </Card>
            ))}
          </div>
        </>
      )}

      {/* PRINT STYLES */}
      <style>{`
        @media print {
          body > *:not(#facture-print-wrapper) { display: none !important; }
          #facture-print { border: none !important; box-shadow: none !important; }
          .no-print { display: none !important; }
          #facture-print input, #facture-print textarea { border: none !important; background: transparent !important; }
        }
      `}</style>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// CORBEILLE
// ═══════════════════════════════════════════════════════
function CorbeilleView({ trash, setTrash, onRestore }) {
  const [filter, setFilter] = useState("all");
  const types = {
    all:        { label: "Tous",        icon: "🗑️" },
    journal:    { label: "Journal",     icon: "📋" },
    debcred:    { label: "Caisse",      icon: "💰" },
    nonpayeurs: { label: "Impayés",     icon: "⚠️" },
    arrivals:   { label: "Arrivages",   icon: "📦" },
    facture:    { label: "Factures",    icon: "📄" },
    receipt:    { label: "Reçus",       icon: "🧾" },
  };
  const filtered = filter === "all" ? trash : trash.filter(t => t.type === filter);

  const permanentDelete = (item) => {
    setTrash(p => p.filter(t => t.trashId !== item.trashId));
  };

  const emptyTrash = () => {
    if (confirm("Vider définitivement la corbeille ? Cette action est irréversible.")) {
      setTrash([]);
    }
  };

  const restoreItem = (item) => {
    onRestore(item.type, item.data);
    setTrash(p => p.filter(t => t.trashId !== item.trashId));
  };

  const labelOf = (item) => {
    const d = item.data;
    switch (item.type) {
      case "journal":    return `${d.client} — ${d.categorie} ×${d.qty}`;
      case "debcred":    return `${d.op} (${d.credit > 0 ? `+${FMT(d.credit)}` : `-${FMT(d.debit)}`})`;
      case "nonpayeurs": return `${d.op} — ${FMT(d.montant)}`;
      case "arrivals":   return `Arrivage ${d.date} — ${d.note || ""}`;
      case "facture":    return `${d.number} — ${d.client?.name}`;
      default:           return JSON.stringify(d).slice(0, 60);
    }
  };

  return (
    <div>
      <SectionHeader
        icon={<SectionIcon id="corbeille" size={28} />}
        title="Corbeille"
        sub="Éléments supprimés — Restaurables ou supprimables définitivement"
        actions={trash.length > 0 ? <UBtn danger onClick={emptyTrash}>🗑️ Vider la corbeille</UBtn> : null}
      />

      {/* Filter tabs */}
      <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
        {Object.entries(types).map(([k, v]) => {
          const count = k === "all" ? trash.length : trash.filter(t => t.type === k).length;
          return (
            <UBtn key={k} small primary={filter === k} onClick={() => setFilter(k)}>
              {v.icon} {v.label} ({count})
            </UBtn>
          );
        })}
      </div>

      {filtered.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 48 }}>
          <SectionIcon id="corbeille" size={56} />
          <p style={{ color: "#9e9e9e", margin: "14px 0 4px", fontWeight: 600 }}>
            {trash.length === 0 ? "Corbeille vide" : "Aucun élément dans cette catégorie"}
          </p>
          <p style={{ fontSize: 12, color: "#bbb", margin: 0 }}>Les éléments supprimés apparaîtront ici.</p>
        </Card>
      ) : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ background: "#faf5fb" }}>
                {["Type", "Description", "Supprimé le", "Actions"].map((h, i) => (
                  <th key={i} style={{ ...S.th, textAlign: i === 3 ? "right" : "left" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((item, i) => (
                <tr key={item.trashId} style={{ background: i % 2 === 0 ? "#fff" : "#faf5fb", borderBottom: "1px solid #ece6f0" }}>
                  <td style={S.td}>
                    <span style={{ background: "#f3e5f5", color: VIO, fontSize: 10, fontWeight: 700, padding: "3px 10px", borderRadius: 20 }}>
                      {types[item.type]?.icon} {types[item.type]?.label}
                    </span>
                  </td>
                  <td style={{ ...S.td, fontWeight: 500, fontSize: 13 }}>{labelOf(item)}</td>
                  <td style={{ ...S.td, fontSize: 11, color: "#9e9e9e" }}>
                    {new Date(item.deletedAt).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}
                  </td>
                  <td style={{ ...S.td, textAlign: "right" }}>
                    <UBtn small onClick={() => restoreItem(item)} style={{ marginRight: 8 }}>↻ Restaurer</UBtn>
                    <UBtn small danger onClick={() => permanentDelete(item)}>🗑 Détruire</UBtn>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

        <div style={{ background: "#faf5fb", borderRadius: 10, padding: 14, marginBottom: 14 }}>
          <p style={{ fontSize: 13, fontWeight: 600, color: VIO, margin: "0 0 10px" }}>Ce client est-il non-payeur ?</p>
          <div style={{ display: "flex", gap: 10 }}>
            {["Payé", "Non payé"].map(v => (
              <label key={v} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", flex: 1, background: isNp === (v === "Non payé") ? "#f3e5f5" : "#fff", border: `1px solid ${isNp === (v === "Non payé") ? VIO : "#ddd"}`, borderRadius: 8, padding: "9px 12px", transition: "all .15s" }}>
                <input type="radio" name="np" checked={isNp === (v === "Non payé")} onChange={() => setIsNp(v === "Non payé")} style={{ accentColor: VIO }} />
                <span style={{ fontSize: 13, fontWeight: 600, color: VIO }}>{v}</span>
              </label>
            ))}
          </div>
        </div>
        {isNp && (
          <div style={{ marginBottom: 12, background: "#fff5f5", borderRadius: 8, padding: 12 }}>
            <p style={{ fontSize: 11, fontWeight: 700, color: "#B71C1C", margin: "0 0 8px" }}>Articles non payés :</p>
            {npRows.map((r, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
                <span style={{ color: "#555" }}>{r.op}</span>
                <span style={{ fontWeight: 700, color: "#B71C1C" }}>{FMT(r.montant)}</span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 10px", background: "#B71C1C", borderRadius: 6, marginTop: 8 }}>
              <span style={{ color: "#fff", fontWeight: 700, fontSize: 12 }}>Total dû</span>
              <span style={{ color: YEL, fontWeight: 800, fontSize: 13 }}>{FMT(total)}</span>
            </div>
          </div>
        )}
        <div style={{ display: "flex", gap: 10 }}>
          <UBtn onClick={onSkip} style={{ flex: 1, justifyContent: "center" }}>Ignorer</UBtn>
          <UBtn primary onClick={() => onConfirm(isNp ? npRows : null)} style={{ flex: 1, justifyContent: "center" }}>{isNp ? "Enregistrer impayé" : "✓ Confirmer payé"}</UBtn>
        </div>
      </Card>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════
function WTSApp() {
  const [view, setView] = useState("dashboard");
  const [loading, setLoading] = useState(false);
  const [loadingSection, setLoadingSection] = useState("dashboard");
  const [loadingDuration, setLoadingDuration] = useState(700);
  const [animIdx, setAnimIdx] = useState(0);
  const [npModal, setNpModal] = useState(null);
  const [newFacModal, setNewFacModal] = useState(false);

  const [receipts, setReceipts] = useLS("receipts", []);
  const [journal, setJournal] = useLS("journal", []);
  const [debcred, setDebCred] = useLS("debcred", []);
  const [nonPayeurs, setNonPayeurs] = useLS("nonpayeurs", []);
  const [stock, setStock] = useLS("stock", {});
  const [arrivals, setArrivals] = useLS("arrivals", []);
  const [factures, setFactures] = useLS("factures", [SAMPLE_FACTURE, SAMPLE_BDL]);
  // Auto-seed samples if missing (for existing users)
  useEffect(() => {
    const hasFac = factures.some(f => f.id === SAMPLE_FACTURE.id);
    const hasBdl = factures.some(f => f.id === SAMPLE_BDL.id);
    if (!hasFac || !hasBdl) {
      const seed = [];
      if (!hasFac) seed.push(SAMPLE_FACTURE);
      if (!hasBdl) seed.push(SAMPLE_BDL);
      setFactures(p => [...seed, ...p]);
    }
  }, []);
  const [trash, setTrash] = useLS("trash", []);

  const navigate = (v) => {
    setAnimIdx(a => a + 1);
    setLoadingSection(v);
    setLoadingDuration(700);
    setLoading(true);
    setTimeout(() => { setView(v); setLoading(false); }, 700);
  };

  // Fire-and-forget trash logic: optimistic UI, instant response
  const sendToTrash = useCallback((type, data) => {
    const item = {
      trashId: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      type,
      data,
      deletedAt: new Date().toISOString(),
    };
    // Fire and forget — update in next tick for UI speed
    setTimeout(() => setTrash(p => [item, ...p]), 0);
  }, [setTrash]);

  // Restore from trash
  const restoreFromTrash = useCallback((type, data) => {
    switch (type) {
      case "journal":    setJournal(p => [data, ...p]); break;
      case "debcred":    setDebCred(p => [data, ...p]); break;
      case "nonpayeurs": setNonPayeurs(p => [data, ...p]); break;
      case "arrivals":   setArrivals(p => [data, ...p]); break;
      case "facture":    setFactures(p => [data, ...p]); break;
    }
  }, [setJournal, setDebCred, setNonPayeurs, setArrivals, setFactures]);

  const handleNpRequired = (r) => setNpModal(r);
  const handleNpConfirm = (rows) => {
    if (rows) setNonPayeurs(p => [...rows, ...p]);
    setNpModal(null);
  };

  // New facture flow: click button → modal → choice → 5s loading → create + open
  const handleNewFactureRequest = () => setNewFacModal(true);
  const handleFactureTypeChosen = (type) => {
    setNewFacModal(false);
    setLoadingSection("newFacture");
    setLoadingDuration(5000);
    setLoading(true);
    setTimeout(() => {
      const newFac = {
        id: `fac-${Date.now()}`,
        type,
        number: genFactureNum(type, factures),
        date: TODAY(),
        mode_paiement: type === "vente" ? "Espèce" : "",
        client: { name: "", address: "", city: "", tel: "" },
        items: [{ id: 1, desc: "", qty: 1, poids: "", pu: 0, total: 0 }],
        locked: false,
        createdAt: new Date().toISOString(),
      };
      setFactures(p => [newFac, ...p]);
      setLoading(false);
    }, 5000);
  };

  if (loading) return <LoadingScreen section={loadingSection} animIdx={animIdx} duration={loadingDuration} />;

  const vp = { receipts, setReceipts, journal, setJournal, debcred, setDebCred,
    nonPayeurs, setNonPayeurs, stock, setStock, arrivals, setArrivals,
    factures, setFactures, trash, setTrash, sendToTrash };

  return (
    <div style={{ minHeight: "100vh", fontFamily: "'DM Sans',sans-serif", background: "#f5f0f7" }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <style>{`* { box-sizing: border-box; } body { margin: 0; }`}</style>

      {/* TOPBAR */}
      <header style={{ background: "#fff", borderBottom: "1px solid #ece6f0", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 20px", height: 52, position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={WTS_LOGO} alt="WTS" style={{ height: 34, objectFit: "contain" }} />
          <div style={{ display: "flex", flexDirection: "column", lineHeight: 1 }}>
            <span style={{ fontWeight: 800, fontSize: 13, color: VIO, letterSpacing: -0.3 }}>WTS Manager</span>
            <span style={{ fontSize: 9, color: "#9e9e9e", letterSpacing: "0.3px" }}>Wawi Travaux et Services</span>
          </div>
        </div>
        <nav style={{ display: "flex", gap: 2 }}>
          {SECTIONS.map(s => (
            <button key={s.id} onClick={() => navigate(s.id)}
              style={{ padding: "5px 11px", borderRadius: 20, fontSize: 12, fontWeight: view === s.id ? 700 : 500, color: view === s.id ? VIO : "#555", background: view === s.id ? "#f3e5f5" : "transparent", border: "none", cursor: "pointer", fontFamily: "inherit", transition: "all .15s" }}>
              {s.label}
            </button>
          ))}
        </nav>
        <div style={{ width: 34 }} />
      </header>

      <main style={{ maxWidth: 1100, margin: "0 auto", padding: "22px 16px 80px" }}>
        {view === "dashboard" && <Dashboard {...vp} navigate={navigate} />}
        {view === "receipt" && <ReceiptEditor {...vp} onNpRequired={handleNpRequired} />}
        {view === "journal" && <JournalView {...vp} />}
        {view === "debcred" && <DebCredView {...vp} />}
        {view === "nonpayeurs" && <NonPayeursView {...vp} />}
        {view === "stock" && <StockView {...vp} />}
        {view === "facture" && <FactureView factures={factures} setFactures={setFactures} sendToTrash={sendToTrash} onNewRequest={handleNewFactureRequest} />}
        {view === "rapport" && <RapportView journal={journal} debcred={debcred} nonPayeurs={nonPayeurs} receipts={receipts} />}
        {view === "corbeille" && <CorbeilleView trash={trash} setTrash={setTrash} onRestore={restoreFromTrash} />}
      </main>

      {/* BOTTOM NAV */}
      <nav style={{ position: "fixed", bottom: 0, left: 0, width: "100%", background: "#fff", borderTop: "1px solid #ece6f0", display: "flex", justifyContent: "space-around", padding: "7px 0 10px", zIndex: 100, overflowX: "auto" }}>
        {SECTIONS.map(s => (
          <div key={s.id} onClick={() => navigate(s.id)}
            style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "4px 8px", borderRadius: 20, cursor: "pointer", background: view === s.id ? "#f3e5f5" : "transparent", transition: "all .15s", flexShrink: 0 }}>
            <SectionIcon id={s.id} size={20} />
            <span style={{ fontSize: 9, fontWeight: view === s.id ? 700 : 500, color: view === s.id ? VIO : "#9e9e9e" }}>{s.label}</span>
          </div>
        ))}
      </nav>

      {npModal && <NpModal receipt={npModal} onConfirm={handleNpConfirm} onSkip={() => setNpModal(null)} />}
      {newFacModal && <NewFactureModal onChoose={handleFactureTypeChosen} onClose={() => setNewFacModal(false)} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WTSApp));
  </script>
</body>
</html>
